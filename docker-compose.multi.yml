# EpochFlow multi-user isolation stack: PostgreSQL + Milvus standalone
# Usage:
#   docker compose -f docker-compose.multi.yml up -d
#   set STORAGE_MODE=multi DATABASE_URL=... MILVUS_URI=... JWT_SECRET=...
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: epochflow
      POSTGRES_PASSWORD: epochflow
      POSTGRES_DB: epochflow
    ports:
      - "5432:5432"
    volumes:
      - epochflow_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U epochflow -d epochflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >
      etcd
      -advertise-client-urls=http://etcd:2379
      -listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    volumes:
      - epochflow_etcd:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    # Prefer locally tagged image; if Hub is blocked, pull via Huawei/DaoCloud mirror then retag.
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    pull_policy: if_not_present
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - epochflow_minio:/minio_data

  milvus:
    image: milvusdb/milvus:v2.4.4
    pull_policy: if_not_present
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      etcd:
        condition: service_started
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s
    volumes:
      - epochflow_milvus:/var/lib/milvus

volumes:
  epochflow_pg:
  epochflow_etcd:
  epochflow_minio:
  epochflow_milvus:
